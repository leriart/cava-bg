[package]
name = "cava-bg"
version = "0.2.9"
edition = "2021"
license = "MIT"
description = "Audio visualizer for Wayland"
authors = ["Leriart"]
repository = "https://github.com/leriart/cava-bg"
homepage = "https://github.com/leriart/cava-bg"

[features]
default = []
dbus-detection = ["dep:dbus"]

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
ctrlc = "3.4"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
walkdir = "2.5"
image = "0.24"
once_cell = "1.20"
color-thief = "0.2"
bytemuck = "1.14"
bytemuck_derive = "1.5"
wgpu = "0.19"
pollster = "0.3"
wayland-client = "0.31"
wayland-egl = "0.32"
smithay-client-toolkit = { git = "https://github.com/Smithay/client-toolkit.git", rev = "99ddfec" }
calloop = "0.14"
calloop-wayland-source = "0.4"
raw-window-handle = "0.6"
libc = "0.2"
serde_json = "1.0"
urlencoding = "2.1"
dbus = { version = "0.9", optional = true }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
clap = "4"
sd-notify = "0.5"

[workspace]
members = ["xtask"]
resolver = "2"

[build-dependencies]
clap = "4"
clap_complete = "4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# NOTE: deliberately NOT `panic = "abort"`.
#
# `main.rs::run_foreground` wraps the renderer in `panic::catch_unwind` and
# restarts it after 2 s. That recovery is a no-op when aborting is on, so a
# single panic in a GPU driver callback would take the whole daemon down. The
# unwinding tables cost a few hundred KB and buy a daemon that survives a
# transient fault instead of leaving the user with a black bar.
debug = false
incremental = false
overflow-checks = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1

# NOTE: there is deliberately no `[package.metadata.deb]`,
# `[package.metadata.generate-rpm]` or `[package.metadata.rpm]` block here.
#
# `cargo deb` and `cargo generate-rpm` would read dependency lists from these
# tables, making them a second source of truth that silently drifts from
# packaging/deb/control and packaging/rpm/cava-bg.spec. That drift is how a
# `Depends: wayland` line — a package name that exists on Fedora and Arch but
# NOT on Debian — reached a published .deb and broke `apt install`.
#
# These tables also cannot express wgpu's real requirements: EGL,
# libwayland-client, libwayland-egl and libxkbcommon are dlopen'd at runtime
# and never appear in the ELF NEEDED list, so no linker-driven tool would find
# them. packaging/ lists them explicitly.
#
# To produce packages, use ./packaging/build-all.sh.
