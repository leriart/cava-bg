name: Release

# Manual only.
#
# This workflow used to start by itself through `workflow_run` whenever CI passed
# on `main`, and `main` itself was updated by the version bump it pushed — so a
# stream of fix commits produced 0.2.6 through 0.2.10 in a single day, each one a
# new tag and a new GitHub release, none of them intended.
#
# Now nothing happens until somebody asks for it, and the version is chosen in
# this dialog rather than inferred.
#
# The tag list and the suggested next version are written to the run's Summary
# page. GitHub's `workflow_dispatch` cannot build a dropdown from live data —
# a `choice` input's options are fixed in this file — so the listing is shown
# there and the version is typed, or left empty to take the suggestion.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. 0.2.11. A leading "v" is accepted. Leave
          empty to use the suggested next version from the run summary.
        type: string
        required: false
        default: ''
      publish_aur:
        description: 'Also push PKGBUILD and .SRCINFO to the AUR'
        type: boolean
        default: true
      force:
        description: 'Re-release a version whose tag already exists'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish_aur: ${{ steps.plan.outputs.publish_aur }}
      force: ${{ steps.plan.outputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Decide the version
        run: |
          set -euo pipefail
          source scripts/version.sh

          # The Run workflow dialog lets you pick a branch, and the bump job
          # pushes its HEAD to main. Running this from `dev` would therefore
          # fast-forward main onto dev and release whatever is there.
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::This workflow has to be run from 'main', but it was run from '${GITHUB_REF_NAME}'."
            echo "::error::The version bump pushes to main, so any other branch would push its own HEAD there."
            exit 1
          fi

          LATEST="$(cava_bg_latest_tag_version)"
          if [ -n "$LATEST" ]; then
            SUGGESTED="$(cava_bg_next_patch "$LATEST")"
          else
            SUGGESTED="$(cava_bg_version)"
          fi

          INPUT="${{ inputs.version }}"
          # A leading "v" was the convention for a while; accept it rather than
          # failing on a difference that does not matter.
          VERSION="${INPUT#v}"
          [ -z "$VERSION" ] && VERSION="$SUGGESTED"

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a version like 0.2.11."
            exit 1
          fi

          # Typing the version by hand makes it easy to go backwards. Releasing
          # something older than the newest tag would move the project's version
          # back in time for everyone.
          if [ -n "$LATEST" ] && cava_bg_version_gt "$LATEST" "$VERSION"; then
            echo "::error::'$VERSION' is older than the newest tag '$LATEST'."
            echo "::error::Release something newer, or pass force=true if this is deliberate."
            exit 1
          fi

          FORCE="${{ inputs.force }}"
          EXISTS=no
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            EXISTS=yes
            if [ "$FORCE" != "true" ]; then
              echo "::error::tag $VERSION already exists."
              echo "::error::Start this workflow again with force=true to re-release it, or pick another version."
              exit 1
            fi
            echo "::notice::tag $VERSION exists; re-releasing because force=true"
          fi

          {
            echo "## Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| newest existing tag | \`${LATEST:-none}\` |"
            echo "| suggested next | \`${SUGGESTED}\` |"
            echo "| requested in the dialog | \`${INPUT:-<empty>}\` |"
            echo "| **will release** | **\`${VERSION}\`** |"
            echo "| tag exists already | ${EXISTS} |"
            echo "| publish to AUR | ${{ inputs.publish_aur }} |"
            echo "| force | ${FORCE} |"
            echo
            echo "### Existing tags, newest first"
            echo
            echo '```'
            git tag --list --sort=-v:refname | head -30
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "tag=${VERSION}"     >>"$GITHUB_OUTPUT"
          echo "publish_aur=${{ inputs.publish_aur }}" >>"$GITHUB_OUTPUT"
          echo "force=${FORCE}"     >>"$GITHUB_OUTPUT"

  bump:
    name: Set the version in Cargo.toml
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: bump
        name: Write, commit and push
        run: |
          set -euo pipefail
          source scripts/version.sh
          WANTED="${{ needs.plan.outputs.version }}"

          if [ "$(cava_bg_version)" = "$WANTED" ]; then
            echo "Cargo.toml is already at $WANTED"
          else
            cava_bg_write_cargo_version "$WANTED"

            # Cargo.lock records the workspace version too, and every build step
            # runs cargo with --locked, which refuses to start when the lock and
            # the manifest disagree. --precise rewrites only the cava-bg entry.
            cargo update -p cava-bg --precise "$WANTED"

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            # No [skip ci] needed any more: this workflow has no push trigger,
            # so pushing to main cannot start anything.
            git commit -m "chore(release): $WANTED" --quiet
            if ! git push origin HEAD:main; then
              echo "::error::Could not push the version bump to main (protected branch?)."
              echo "::error::Nothing was tagged or published."
              exit 1
            fi
            echo "::notice::Set Cargo.toml and Cargo.lock to $WANTED on main"
          fi

          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  build:
    name: Build the artifacts
    needs: [plan, bump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Install system dependencies
        run: bash scripts/ci-deps.sh

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Verify tests pass before packaging
        run: cargo test --workspace --locked

      - name: Build source + binary tarballs, .deb and AUR files
        env:
          CAVA_BG_SKIP_RPM: "1"   # built in the `rpm` job, on Fedora
          CARGO_BUILD_ARGS: "--locked"
        run: bash packaging/build-all.sh --allow-dirty

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          cp target/dist/*.tar.gz target/dist/*.sha256 upload/ 2>/dev/null || true
          cp target/dist/*.deb upload/ 2>/dev/null || true
          ls -lh upload/

      - uses: actions/upload-artifact@v4
        with:
          name: cava-bg-release
          path: upload/
          retention-days: 7
          if-no-files-found: error

  rpm:
    name: Build the .rpm on Fedora
    needs: [plan, bump]
    runs-on: ubuntu-latest
    # rpmbuild validates the spec's BuildRequires against package names that only
    # exist on an RPM distro, so this needs Fedora, not the Ubuntu runner where
    # everything else is built. Reaching for --nodeps to dodge the check would
    # produce a binary linked against Ubuntu's sonames and ship it to Fedora.
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            git make rpm-build systemd-rpm-macros

          # ffmpeg is not in Fedora's own repositories; the spec already declares
          # `Requires: ffmpeg`, and RPM Fusion is where Fedora users get it.
          dnf install -y \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
            || dnf install -y \
            "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"

          # clang is not optional: ffmpeg-sys-next runs bindgen, which needs
          # libclang.
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust pkg-config clang \
            wayland-devel libxkbcommon-devel mesa-libEGL-devel mesa-libGL-devel \
            dbus-devel ffmpeg-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Build the RPM
        env:
          HOME: /root
        run: bash packaging/rpm/build-rpm.sh

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cava-bg-rpm
          path: target/rpm/**/*.rpm
          if-no-files-found: error
          retention-days: 7

      # The container's log is not reachable through the API without auth, so
      # publish it: a failed Fedora build has to be diagnosable from outside.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rpmbuild-log
          path: |
            target/rpm/rpmbuild.log
            /root/rpmbuild/BUILD/*.log
          if-no-files-found: ignore
          retention-days: 7

  github-release:
    name: Tag and publish
    needs: [plan, bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump.outputs.sha }}

      # The tag is created here, after the build, so a failed build cannot leave
      # a tag pointing at code that was never released. Doing it next to the
      # version decision is how two orphan tags were produced.
      - name: Create and push the tag
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.tag }}"
          FORCE="${{ needs.plan.outputs.force }}"
          HEAD="$(git rev-parse HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n1 "$TAG")"

            # A forced re-release only makes sense for the commit the tag
            # already points at — that is the "the AUR push failed, run it
            # again" case. Reusing the tag while building different code would
            # publish artifacts that do not correspond to the tag, so that is
            # refused rather than papered over by moving the tag: deleting a
            # tag that has a release attached has side effects on GitHub, and
            # silently rewriting history is not this workflow's business.
            if [ "$TAG_SHA" != "$HEAD" ]; then
              echo "::error::Tag $TAG points at ${TAG_SHA:0:8}, but this release builds ${HEAD:0:8}."
              echo "::error::A forced re-release is for re-running the same commit."
              echo "::error::To release different code under this version, delete the tag first:"
              echo "::error::    git push origin :refs/tags/$TAG"
              exit 1
            fi
            echo "::notice::Re-releasing $TAG at its existing commit ${HEAD:0:8}"
          else
            git tag -a "$TAG" -m "cava-bg $TAG"
            git push origin "$TAG" || { echo "::error::Could not push tag $TAG"; exit 1; }
            echo "::notice::Tag $TAG now points at ${HEAD:0:8}"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-release
          path: upload/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## cava-bg ${TAG}"
            echo
            echo "Audio visualizer for Wayland, rendered as a wlr-layer-shell background layer."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/leriart/cava-bg/main/install.sh | bash"
            echo '```'
            echo
            echo "| File | Target |"
            echo "|------|--------|"
            echo "| \`.deb\` | Debian / Ubuntu |"
            echo "| \`.rpm\` | Fedora / openSUSE (attached separately) |"
            echo "| \`-x86_64-unknown-linux-gnu.tar.gz\` | Arch / NixOS / manual |"
            echo "| \`aur-*.tar.gz\` | Arch (AUR) |"
            echo "| \`.tar.gz\` (no arch) | source |"
          } >release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-release: replace the assets and the notes instead of failing.
            echo "::notice::Release $TAG already exists; replacing its assets"
            gh release upload "$TAG" upload/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" upload/* --title "cava-bg ${TAG}" \
              --notes-file release-notes.md --verify-tag
          fi
          echo "::notice::Published https://github.com/leriart/cava-bg/releases/tag/${TAG}"

  attach-rpm:
    name: Attach the RPM
    needs: [plan, github-release, rpm]
    if: needs.rpm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-rpm
          path: rpm

      - name: Upload the RPM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # upload-artifact keeps the path structure relative to the matched
          # files' common directory, so the RPM comes back as
          # rpm/x86_64/... rather than in the working directory.
          mapfile -t rpms < <(find rpm -name '*.rpm' -type f)
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "::error::no .rpm found in the cava-bg-rpm artifact"
            find rpm -type f | head -20
            exit 1
          fi
          printf '  %s\n' "${rpms[@]}"
          gh release upload "$TAG" "${rpms[@]}" --clobber
          echo "::notice::Attached ${#rpms[@]} RPM(s) to $TAG"

  aur:
    name: Publish to AUR
    needs: [plan, github-release]
    if: needs.plan.outputs.publish_aur == 'true'
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - name: Fail early when the credentials are missing
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ] || [ -z "${AUR_SSH_KNOWN_HOSTS}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY / AUR_SSH_KNOWN_HOSTS are not set."
            echo "::error::Add them under Settings -> Environments -> aur."
            exit 1
          fi

      # Runs before the checkout and the downloads so that an authentication
      # problem reports itself instead of being hidden behind a later failure.
      - name: Configure SSH for aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # These are ssh_config directives, not shell commands. Written directly
          # into this script the shell tried to execute `IdentityFile` and
          # `set -e` aborted the step.
          {
            echo "Host aur.archlinux.org"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
          } >~/.ssh/config
          chmod 600 ~/.ssh/config

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            # Describe the shape of the secret rather than quoting it: GitHub
            # replaces anything that matches a secret with ***, so printing the
            # content produced an unreadable "First line is: ***".
            keyfile=~/.ssh/id_ed25519
            key_lines=$(wc -l <"$keyfile" | tr -d ' ')
            key_bytes=$(wc -c <"$keyfile" | tr -d ' ')
            if head -1 "$keyfile" | grep -qE '^[^ ]+ +ssh-(ed25519|rsa) '; then
              kind='a known_hosts line — that belongs in AUR_SSH_KNOWN_HOSTS, not here'
            elif head -1 "$keyfile" | grep -q 'ssh-ed25519\|ssh-rsa'; then
              kind='a PUBLIC key (the .pub file); this secret needs the PRIVATE one'
            elif [ "$key_lines" -le 1 ]; then
              kind='a single line — the newlines were lost when pasting'
            elif grep -q 'BEGIN OPENSSH PRIVATE KEY' "$keyfile"; then
              kind='an OpenSSH private key whose body ssh-keygen rejects'
            elif grep -qi 'BEGIN .*PRIVATE KEY' "$keyfile"; then
              kind='a legacy PEM private key — AUR only accepts ed25519 in OpenSSH format'
            else
              kind='not a private key in any format ssh-keygen recognises'
            fi
            echo "::error::AUR_SSH_PRIVATE_KEY is not a usable private key."
            echo "::error::It looks like: $kind."
            echo "::error::Shape: $key_lines line(s), $key_bytes bytes."
            echo "::error::Expected: the ed25519 PRIVATE key file, pasted whole — roughly"
            echo "::error::400 bytes over 7 lines, starting with -----BEGIN OPENSSH PRIVATE KEY-----."
            exit 1
          fi
          echo "::notice::Key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519 2>&1 | awk '{print $2}')"
          echo "::notice::That fingerprint must appear at https://aur.archlinux.org/account/sshkeys"

          if ! ssh_output=$(ssh -o BatchMode=yes aur@aur.archlinux.org true 2>&1); then
            echo "::error::SSH to aur.archlinux.org failed:"
            echo "$ssh_output"
            echo "::error::On 'Permission denied (publickey)', compare the fingerprint above"
            echo "::error::with the keys at https://aur.archlinux.org/account/sshkeys"
            exit 1
          fi
          echo "::notice::AUR SSH authentication OK"

      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-release
          path: upload/

      - name: Render the PKGBUILD with the real checksum and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: x86_64
        run: |
          set -euo pipefail

          SRC_TAR="upload/cava-bg-${VERSION}.tar.gz"
          test -f "$SRC_TAR" || { echo "::error::missing ${SRC_TAR}"; exit 1; }
          SHA256="$(sha256sum "$SRC_TAR" | cut -d' ' -f1)"
          echo "::notice::cava-bg-${VERSION}.tar.gz sha256=${SHA256}"

          rm -rf /tmp/aur
          git clone --quiet ssh://aur@aur.archlinux.org/cava-bg.git /tmp/aur
          cd /tmp/aur

          VERSION="$VERSION" ARCH=x86_64 SHA256="$SHA256" \
            OUT_DIR=/tmp/aur bash source/packaging/aur/render-pkgbuild.sh

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "::notice::AUR already up to date at ${VERSION}; nothing to push."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cava-bg ${VERSION}: update PKGBUILD and .SRCINFO" --quiet
          git push --quiet
          echo "::notice::Pushed cava-bg ${VERSION} to the AUR"
