name: Release

# Merging `dev` into `main` is the only release trigger. The version does not
# have to be managed by hand: the workflow reads the newest tag, decides the
# next version, writes it back into Cargo.toml, tags it and publishes every
# artifact plus the AUR package bump.
#
#   no tag newer than Cargo.toml  ->  cut the next patch release
#   dev bumped Cargo.toml         ->  honour that version
#   --force                       ->  re-run an already-tagged release
#
# Tags follow the repository's existing convention: bare `0.2.7`, not `v0.2.7`.

on:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      publish_aur:
        description: 'Also push to the AUR repository'
        type: boolean
        default: true
      force:
        description: 'Re-run the release for the newest tag instead of cutting a new version'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_ARGS: --locked

jobs:
  plan:
    name: Resolve version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      publish_aur: ${{ steps.plan.outputs.publish_aur }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Decide the version
        run: |
          set -euo pipefail
          source scripts/version.sh

          FORCE=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [ "${{ inputs.force }}" = "true" ] && FORCE=true
            [ "${{ inputs.publish_aur }}" = "true" ] && PUBLISH_AUR=true
          fi

          # A tag push always releases exactly the tag that was pushed.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
            PUBLISH_AUR=false
            echo "tag push: releasing ${GITHUB_REF_NAME}" >&2
          elif FORCE; then
            VERSION="$(cava_bg_latest_tag_version)"
            if [ -z "$VERSION" ]; then
              echo "::error::--force requested but no release tag exists yet"; exit 1
            fi
            RELEASE=true
            echo "forced re-run of ${VERSION}" >&2
          else
            VERSION="$(cava_bg_resolve_release_version false)"
            RELEASE=true
          fi

          TAG="${VERSION}"

          # For a tag push, Cargo.toml must already agree with the tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CURRENT="$(cava_bg_version)"
            if [ "$CURRENT" != "$VERSION" ]; then
              echo "::error::tag ${TAG} does not match Cargo.toml version ${CURRENT}"
              exit 1
            fi
          fi

          PUBLISH_AUR="${PUBLISH_AUR:-false}"
          [ "$RELEASE" = "true" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && PUBLISH_AUR=true

          echo "version=${VERSION}"       >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}"               >>"$GITHUB_OUTPUT"
          echo "release=${RELEASE}"       >>"$GITHUB_OUTPUT"
          echo "publish_aur=${PUBLISH_AUR}" >>"$GITHUB_OUTPUT"
          echo "::notice::cava-bg ${TAG} release=${RELEASE} publish_aur=${PUBLISH_AUR}"

      - name: Commit the version bump to main
        id: bump
        if: steps.plan.outputs.release == 'true' && github.ref_type != 'tag'
        run: |
          set -euo pipefail
          source scripts/version.sh
          WANTED="${{ steps.plan.outputs.version }}"
          if [ "$(cava_bg_version)" = "$WANTED" ]; then
            echo "Cargo.toml already at $WANTED"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cava_bg_write_cargo_version "$WANTED"
          git add Cargo.toml
          # [skip ci] is essential: this commit lands on main, and without it
          # GitHub would start a second run, which would see "Cargo.toml ==
          # newest tag" and bump again — forever. Skipping the trigger while
          # letting the current run continue is exactly what we want. The build
          # job below re-runs `cargo test` anyway, so nothing goes unverified.
          git commit -m "chore(release): $WANTED [skip ci]" --quiet
          if ! git push origin HEAD:main; then
            echo "::error::Could not push the version bump to main."
            echo "::error::main may be protected, or someone pushed while this run was starting."
            echo "::error::No tag was created, so nothing was published. Re-run once main is writable."
            exit 1
          fi
          echo "::notice::Bumped Cargo.toml to $WANTED on main"

      - name: Tag the release
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          VERSION="${{ steps.plan.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
            exit 0
          fi
          git tag -a "$TAG" -m "cava-bg $VERSION"
          git push origin "$TAG"
          echo "::notice::Created and pushed tag $TAG"

  build:
    name: Build all artifacts
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config rpm fakeroot dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Verify tests pass before packaging
        run: cargo test --workspace --locked

      - name: Build source + binary tarballs, .deb, .rpm, AUR files
        run: |
          # build-all.sh renders the PKGBUILD with an @SHA256SUM@ placeholder;
          # it is re-rendered with the real checksum in the AUR job.
          CARGO_BUILD_ARGS="--locked" bash packaging/build-all.sh --allow-dirty

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          cp target/dist/*.tar.gz target/dist/*.sha256 upload/ 2>/dev/null || true
          cp target/dist/*.deb upload/ 2>/dev/null || true
          cp target/dist/*.rpm upload/ 2>/dev/null || true
          ls -lh upload/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cava-bg-release
          path: upload/
          retention-days: 7
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-release
          path: upload/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## cava-bg ${TAG}"
            echo
            echo "Audio visualizer for Wayland, rendered as a wlr-layer-shell background layer."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/leriart/cava-bg/main/install.sh | bash"
            echo '```'
            echo
            echo "### Artifacts"
            echo
            echo "| File | Target distro |"
            echo "|------|---------------|"
            echo "| \`.deb\` | Debian / Ubuntu |"
            echo "| \`.rpm\` | Fedora / openSUSE |"
            echo "| \`-x86_64-unknown-linux-gnu.tar.gz\` | Arch / NixOS / manual |"
            echo "| \`aur-*.tar.gz\` | Arch (AUR) |"
            echo "| \`.tar.gz\` (no arch) | source |"
          } >release-notes.md
          gh release create "$TAG" upload/* --title "cava-bg ${TAG}" \
            --notes-file release-notes.md --verify-tag
          echo "::notice::Published https://github.com/leriart/cava-bg/releases/tag/${TAG}"

  aur:
    name: Publish to AUR
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.publish_aur == 'true'
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - name: Fail early when AUR credentials are missing
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ] || [ -z "${AUR_SSH_KNOWN_HOSTS}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY / AUR_SSH_KNOWN_HOSTS secrets are not set."
            echo "::error::Add them under Settings -> Secrets (or Actions -> Environments -> aur)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-release
          path: upload/

      - name: Configure SSH for aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # AUR accepts ed25519 keys only, and ssh already prefers it when an
          # ssh-agent is present — make the choice explicit so a stale RSA key
          # left on the runner cannot be offered instead.
          IdentityFile ~/.ssh/id_ed25519
          IdentitiesOnly yes

          # Never block on an interactive prompt: an auth or host-key problem
          # should fail the job immediately with a readable error.
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes"
          echo "GIT_SSH_COMMAND=$GIT_SSH_COMMAND" >>"$GITHUB_ENV"

          # Fail fast with a clear message rather than inside git's clone.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 aur@aur.archlinux.org \
              "true" 2>/dev/null || {
            echo "::error::SSH to aur.archlinux.org failed. Check that the AUR_SSH_PRIVATE_KEY secret"
            echo "::error::holds the PRIVATE key and that its public half is registered at"
            echo "::error::https://aur.archlinux.org/account/sshkeys"
            exit 1
          }

      - name: Render PKGBUILD with the real checksum and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: x86_64
        run: |
          set -euo pipefail

          SRC_TAR="upload/cava-bg-${VERSION}.tar.gz"
          test -f "$SRC_TAR" || { echo "::error::missing ${SRC_TAR}"; exit 1; }
          SHA256="$(sha256sum "$SRC_TAR" | cut -d' ' -f1)"
          echo "::notice::cava-bg-${VERSION}.tar.gz sha256=${SHA256}"

          # Not `aur://` — that scheme is not understood by git unless a
          # url.insteadOf mapping is configured, and it would abort with
          # "fatal: remote helper 'aur' aborted session".
          rm -rf /tmp/aur
          git clone --quiet ssh://aur@aur.archlinux.org/cava-bg.git /tmp/aur
          cd /tmp/aur

          VERSION="$VERSION" ARCH=x86_64 SHA256="$SHA256" \
            OUT_DIR=/tmp/aur bash source/packaging/aur/render-pkgbuild.sh

          git add PKGBUILD .SRCINFO 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::AUR already up to date at ${VERSION}; nothing to push."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cava-bg ${VERSION}: update PKGBUILD and .SRCINFO" --quiet
          git push --quiet
          echo "::notice::Pushed cava-bg ${VERSION} to the AUR"
