name: Release

# Merging `dev` into `main` is the only release trigger. The version does not
# have to be managed by hand: the workflow reads the newest tag, decides the
# next version, writes it back into Cargo.toml, tags it and publishes every
# artifact plus the AUR package bump.
#
#   no tag newer than Cargo.toml  ->  cut the next patch release
#   dev bumped Cargo.toml         ->  honour that version
#   --force                       ->  re-run an already-tagged release
#
# Tags follow the repository's existing convention: bare `0.2.7`, not `v0.2.7`.

# There is deliberately no `push:` trigger. Publishing is gated on CI: this
# workflow starts only once the CI run for the same commit has finished green,
# so a broken merge can never reach a release. Manual dispatch stays available
# for retries.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_aur:
        description: 'Also push to the AUR repository'
        type: boolean
        default: true
      force:
        description: 'Re-run the release for the newest tag instead of cutting a new version'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_ARGS: --locked

jobs:
  # Decides whether CI passed, and pins the exact commit to release.
  #
  # `github.sha` during a workflow_run event is the head of the default branch
  # at run-creation time, which is NOT necessarily the commit CI validated --
  # another push could have landed in between. `workflow_run.head_sha` is the
  # commit CI actually ran against, so that is what gets released.
  gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "sha=${GITHUB_SHA}" >>"$GITHUB_OUTPUT"
            echo "ok=true"           >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::CI on ${CI_SHA} finished: ${CI_CONCLUSION}"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "::warning::CI did not pass (${CI_CONCLUSION}); nothing will be published."
            echo "sha="  >>"$GITHUB_OUTPUT"
            echo "ok=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=${CI_SHA}" >>"$GITHUB_OUTPUT"
          echo "ok=true"         >>"$GITHUB_OUTPUT"

  plan:
    name: Resolve version and tag
    needs: gate
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      publish_aur: ${{ steps.plan.outputs.publish_aur }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Release exactly what CI validated, not whatever main points at now.
          ref: ${{ needs.gate.outputs.sha }}

      - id: plan
        name: Decide the version
        run: |
          set -euo pipefail
          source scripts/version.sh

          FORCE=false
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [ "${{ inputs.force }}" = "true" ] && FORCE=true
            [ "${{ inputs.publish_aur }}" = "true" ] && PUBLISH_AUR=true
          fi

          # A tag push always releases exactly the tag that was pushed.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=true
            PUBLISH_AUR=false
            echo "tag push: releasing ${GITHUB_REF_NAME}" >&2
          elif FORCE; then
            VERSION="$(cava_bg_latest_tag_version)"
            if [ -z "$VERSION" ]; then
              echo "::error::--force requested but no release tag exists yet"; exit 1
            fi
            RELEASE=true
            echo "forced re-run of ${VERSION}" >&2
          else
            VERSION="$(cava_bg_resolve_release_version false)"
            RELEASE=true
          fi

          TAG="${VERSION}"

          # For a tag push, Cargo.toml must already agree with the tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CURRENT="$(cava_bg_version)"
            if [ "$CURRENT" != "$VERSION" ]; then
              echo "::error::tag ${TAG} does not match Cargo.toml version ${CURRENT}"
              exit 1
            fi
          fi

          PUBLISH_AUR="${PUBLISH_AUR:-false}"
          [ "$RELEASE" = "true" ] && [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && PUBLISH_AUR=true

          echo "version=${VERSION}"       >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}"               >>"$GITHUB_OUTPUT"
          echo "release=${RELEASE}"       >>"$GITHUB_OUTPUT"
          echo "publish_aur=${PUBLISH_AUR}" >>"$GITHUB_OUTPUT"
          echo "::notice::cava-bg ${TAG} release=${RELEASE} publish_aur=${PUBLISH_AUR}"


  # Applies the decision made by `plan`. Kept separate from it because GitHub
  # Actions steps share a workspace: while `plan` both decided the version and
  # wrote Cargo.toml, this job's `already at $WANTED` check saw the file already
  # updated and exited without committing, so main never received the bump.
  bump:
    name: Apply the version bump
    needs: [gate, plan]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.sha }}

      - id: bump
        name: Write, commit and push Cargo.toml
        run: |
          set -euo pipefail
          source scripts/version.sh
          WANTED="${{ needs.plan.outputs.version }}"

          if [ "$(cava_bg_version)" = "$WANTED" ]; then
            echo "Cargo.toml is already at $WANTED; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cava_bg_write_cargo_version "$WANTED"

            # Cargo.lock records the workspace version too, and every later step
            # runs cargo with --locked, which refuses to proceed when the lock and
            # the manifest disagree:
            #     error: cannot update the lock file because --locked was passed
            # `--precise` touches only the cava-bg entry; all 140-odd dependency
            # versions stay put.
            cargo update -p cava-bg --precise "$WANTED"

            git add Cargo.toml Cargo.lock
            # [skip ci] is essential: this commit lands on main, and without it
            # GitHub would start a second run, which would see "Cargo.toml ==
            # newest tag" and bump again — forever. Skipping the trigger while
            # letting the current run continue is exactly what we want.
            git commit -m "chore(release): $WANTED [skip ci]" --quiet
            if ! git push origin HEAD:main; then
              echo "::error::Could not push the version bump to main."
              echo "::error::Either main is protected, or it moved on since CI validated."
              echo "::error::Nothing was tagged or published."
              exit 1
            fi
            echo "::notice::Bumped Cargo.toml to $WANTED on main"
          fi

          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  build:
    name: Build all artifacts
    needs: [plan, bump]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump commit, so the source tarball carries the released version.
          ref: ${{ needs.bump.outputs.sha }}
      - name: Install build dependencies
        # Shared list; extras for the packaging steps.
        run: bash scripts/ci-deps.sh rpm fakeroot dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Verify tests pass before packaging
        run: cargo test --workspace --locked

      - name: Build source + binary tarballs, .deb and AUR files
        env:
          # The .rpm cannot be built here: see the `rpm` job.
          CAVA_BG_SKIP_RPM: "1"
        run: |
          # build-all.sh renders the PKGBUILD with an @SHA256SUM@ placeholder;
          # it is re-rendered with the real checksum in the AUR job.
          CARGO_BUILD_ARGS="--locked" bash packaging/build-all.sh --allow-dirty

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p upload
          cp target/dist/*.tar.gz target/dist/*.sha256 upload/ 2>/dev/null || true
          cp target/dist/*.deb upload/ 2>/dev/null || true
          ls -lh upload/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cava-bg-release
          path: upload/
          retention-days: 7
          if-no-files-found: error

  rpm:
    name: Build the .rpm on Fedora
    needs: [plan, bump]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # rpmbuild validates the spec's BuildRequires against package names that only
    # exist on an RPM distro, so this has to run on Fedora rather than on the
    # Ubuntu runner where everything else is built. Reaching for --nodeps to
    # dodge that check would produce a binary linked against Ubuntu's sonames and
    # ship it to Fedora users.
    #
    # Proven: the 0.2.7 run built the RPM end to end. It is no longer advisory,
    # so a regression here is visible instead of quietly shipping a release
    # without an RPM.
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            git make rpm-build systemd-rpm-macros

          # ffmpeg is not in Fedora's own repositories -- the spec already
          # requires it at runtime (`Requires: ffmpeg`), and RPM Fusion is where
          # Fedora users get it from.
          dnf install -y \
            "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
            || dnf install -y \
            "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"

          # clang is not optional: ffmpeg-sys-next runs bindgen, which needs
          # libclang. It was installed on the Ubuntu side (libclang-dev) and
          # left out here.
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust pkg-config clang \
            wayland-devel libxkbcommon-devel mesa-libEGL-devel mesa-libGL-devel \
            dbus-devel ffmpeg-devel

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Build the RPM
        env:
          HOME: /root
        run: bash packaging/rpm/build-rpm.sh

      - name: Show what was produced
        run: find target/rpm -name '*.rpm' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cava-bg-rpm
          path: target/rpm/**/*.rpm
          if-no-files-found: error
          retention-days: 7

      # The container's log is not reachable through the API without auth, so
      # publish it as an artifact instead: a failed Fedora build has to be
      # diagnosable from the outside.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rpmbuild-log
          path: |
            target/rpm/rpmbuild.log
            /root/rpmbuild/BUILD/*.log
            /root/rpmbuild/BUILDROOT/*.log
          if-no-files-found: ignore
          retention-days: 7

  github-release:
    name: Tag and publish GitHub release
    needs: [plan, bump, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # The tag is created HERE, not next to the version decision, so that a
      # failed build cannot leave a tag pointing at unreleased code. That is
      # exactly what happened before: two tags were cut for builds that never
      # produced a release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump.outputs.sha }}

      - name: Create and push the tag
        run: |
          set -euo pipefail
          TAG="${{ needs.plan.outputs.tag }}"
          VERSION="${{ needs.plan.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::notice::Tag $TAG already exists; reusing it."
          else
            git tag -a "$TAG" -m "cava-bg $VERSION"
            git push origin "$TAG"
            echo "::notice::Created and pushed tag $TAG"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-release
          path: upload/
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## cava-bg ${TAG}"
            echo
            echo "Audio visualizer for Wayland, rendered as a wlr-layer-shell background layer."
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/leriart/cava-bg/main/install.sh | bash"
            echo '```'
            echo
            echo "### Artifacts"
            echo
            echo "| File | Target distro |"
            echo "|------|---------------|"
            echo "| \`.deb\` | Debian / Ubuntu |"
            echo "| \`.rpm\` | Fedora / openSUSE |"
            echo "| \`-x86_64-unknown-linux-gnu.tar.gz\` | Arch / NixOS / manual |"
            echo "| \`aur-*.tar.gz\` | Arch (AUR) |"
            echo "| \`.tar.gz\` (no arch) | source |"
          } >release-notes.md
          gh release create "$TAG" upload/* --title "cava-bg ${TAG}" \
            --notes-file release-notes.md --verify-tag
          echo "::notice::Published https://github.com/leriart/cava-bg/releases/tag/${TAG}"

  # The RPM is built in a Fedora container and takes ~15 minutes, roughly three
  # times the rest of the pipeline. While github-release waited on it, a slow or
  # cancelled RPM took the tag and the whole release down with it — which is
  # what happened on two consecutive runs. The release now publishes without it
  # and this job attaches the RPM afterwards, so the slowest and least certain
  # artifact can only ever be late, never fatal.
  attach-rpm:
    name: Attach the RPM to the release
    needs: [plan, github-release, rpm]
    if: needs.plan.outputs.release == 'true' && needs.rpm.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-rpm

      - name: Upload the RPM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh ./*.rpm
          gh release upload "$TAG" ./*.rpm --clobber
          echo "::notice::Attached the RPM to $TAG"


  aur:
    name: Publish to AUR
    needs: [plan, bump, build]
    if: needs.plan.outputs.release == 'true' && needs.plan.outputs.publish_aur == 'true'
    runs-on: ubuntu-latest
    environment: aur
    steps:
      - name: Fail early when AUR credentials are missing
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ] || [ -z "${AUR_SSH_KNOWN_HOSTS}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY / AUR_SSH_KNOWN_HOSTS secrets are not set."
            echo "::error::Add them under Settings -> Secrets (or Actions -> Environments -> aur)."
            exit 1
          fi

      - name: Configure SSH for aur.archlinux.org
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # These are ssh_config directives, not shell commands. They were
          # previously written directly into this script, where the shell tried
          # to run `IdentityFile` as a command and `set -e` aborted the step
          # before it ever reached the connectivity probe.
          #
          # A here-doc would have to have its terminator at column zero after
          # YAML strips the block indentation, which is easy to get wrong; a
          # group with redirects has no such trap.
          {
            echo "Host aur.archlinux.org"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
          } >~/.ssh/config
          chmod 600 ~/.ssh/config

          # Check the secret is a usable key before blaming the network. A key
          # pasted as a public key, or with the newlines mangled, fails later
          # with a generic "Permission denied" that says nothing about why.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            # Describe the shape of the secret rather than quoting it: GitHub
            # replaces any text that matches a secret with ***, so printing the
            # first line produced an unreadable "First line is: ***" annotation.
            # These derived facts are not the secret and survive redaction.
            keyfile=~/.ssh/id_ed25519
            key_lines=$(wc -l <"$keyfile" | tr -d ' ')
            key_bytes=$(wc -c <"$keyfile" | tr -d ' ')
            # Order matters. A key whose newlines were lost is one long line
            # that still contains the BEGIN marker, so testing for the marker
            # first misreported it as a readable-but-broken key.
            if head -1 "$keyfile" | grep -q 'ssh-ed25519\|ssh-rsa'; then
              kind='a PUBLIC key; you pasted the wrong half of the pair'
            elif [ "$key_lines" -le 1 ]; then
              kind='a single line — the newlines were lost when pasting'
            elif grep -q 'BEGIN OPENSSH PRIVATE KEY' "$keyfile"; then
              kind='an OpenSSH private key whose body ssh-keygen rejects'
            elif grep -qi 'BEGIN .*PRIVATE KEY' "$keyfile"; then
              kind='a legacy PEM private key — AUR only accepts ed25519 in OpenSSH format'
            else
              kind='not a private key in any format ssh-keygen recognises'
            fi
            echo "::error::AUR_SSH_PRIVATE_KEY is not a usable private key."
            echo "::error::It looks like: $kind."
            echo "::error::Shape: $key_lines line(s), $key_bytes bytes."
            echo "::error::Expected: the contents of your ed25519 PRIVATE key file"
            echo "::error::(starts with -----BEGIN OPENSSH PRIVATE KEY-----), pasted whole."
            exit 1
          fi
          echo "::notice::Key fingerprint: $(ssh-keygen -lf ~/.ssh/id_ed25519 2>&1 | awk '{print $2}')"
          echo "::notice::This is the fingerprint that must appear at https://aur.archlinux.org/account/sshkeys"

          # Fail fast with a clear message rather than inside git's clone. The
          # ssh error is echoed rather than discarded: silencing it made the
          # previous run undiagnosable.
          if ! ssh_output=$(ssh -o BatchMode=yes aur@aur.archlinux.org true 2>&1); then
            echo "::error::SSH to aur.archlinux.org failed:"
            echo "$ssh_output"
            echo "::error::If it says 'Permission denied (publickey)', compare the fingerprint"
            echo "::error::above with the keys registered at https://aur.archlinux.org/account/sshkeys"
            exit 1
          fi
          echo "::notice::AUR SSH authentication OK"

      - uses: actions/checkout@v4
        with:
          path: source
      # Only the source tarball is needed here, to compute the checksum the
      # PKGBUILD pins. An earlier edit accidentally added the RPM download to
      # this job as well — the same download block appears in github-release,
      # so a plain string replace matched both — and this job then failed
      # fetching an artifact it has no use for.
      - uses: actions/download-artifact@v4
        with:
          name: cava-bg-release
          path: upload/

      - name: Render PKGBUILD with the real checksum and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCH: x86_64
        run: |
          set -euo pipefail

          SRC_TAR="upload/cava-bg-${VERSION}.tar.gz"
          test -f "$SRC_TAR" || { echo "::error::missing ${SRC_TAR}"; exit 1; }
          SHA256="$(sha256sum "$SRC_TAR" | cut -d' ' -f1)"
          echo "::notice::cava-bg-${VERSION}.tar.gz sha256=${SHA256}"

          # Not `aur://` — that scheme is not understood by git unless a
          # url.insteadOf mapping is configured, and it would abort with
          # "fatal: remote helper 'aur' aborted session".
          rm -rf /tmp/aur
          git clone --quiet ssh://aur@aur.archlinux.org/cava-bg.git /tmp/aur
          cd /tmp/aur

          VERSION="$VERSION" ARCH=x86_64 SHA256="$SHA256" \
            OUT_DIR=/tmp/aur bash source/packaging/aur/render-pkgbuild.sh

          git add PKGBUILD .SRCINFO 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice::AUR already up to date at ${VERSION}; nothing to push."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cava-bg ${VERSION}: update PKGBUILD and .SRCINFO" --quiet
          git push --quiet
          echo "::notice::Pushed cava-bg ${VERSION} to the AUR"
